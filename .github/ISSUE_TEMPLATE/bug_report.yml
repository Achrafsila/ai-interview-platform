name: Bug report
description: Report a reproducible defect without posting secrets or personal data
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Do not share credentials, real CVs, transcripts, recordings, or other candidate data. Labels must be created in GitHub before submitting if unavailable."
  - type: input
    id: component
    attributes:
      label: Component / sprint
      placeholder: "S2-03 / question bank"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior
      description: What happens?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps (synthetic data only)
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: ClickUp / PR reference
      placeholder: "Link or task ID"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: No secret or personal/candidate information is included.
          required: true
