name: Engineering task
description: Technical work linked to an existing ClickUp item
title: "chore: "
body:
  - type: input
    id: reference
    attributes:
      label: ClickUp task / sprint
      description: Link the owning deliverable to avoid a second backlog.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Goal and context
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, risks and documentation
